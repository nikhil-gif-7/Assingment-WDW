<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>
    <form>
    <fieldset>
        <legend>Personal Details</legend>
        <p><labelfor="n">Name:</label>
        <input type="text" id="n" name="name"></p>
        <p><label for="e">Email:</label>
        <input type="email" id="e" name="email"></p>
        <p><label for="p">Password:</label>
        <input type="password" id="p" name="password"></p>
        <p>Gender:
    <input type="radio" id="m" name="gender" value="male">

        </p>
        <p>Hobbies:
    <input type="checkbox" id="c" name="hobbies" value="coding">
        <label for="c">coding</label>
        </p>
        <p><label for="d">DOB:</label>
        <input type="date" id="d" name="dob">
        </p>
    </fieldset>
    </form>
