<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <title>Multimedia</title></head>
<body>
    <h3>Image</h3>
    <img src="campus.jpg" alt="college" width="200" height="200">
    <h3>Video</h3>
    <video src="clip.mp4" controls width="260"></video>
    <h3>Audio</h3>
    <audio src="song.mp3" controls></audio>
    <h3>YouTube</h3>
    <iframe width="420" height="236" src="https://www.youtube.com/embed/VIDEO_ID"
    title="YouTube video"
    allowfullscreen></iframe>
</body>
</html>
