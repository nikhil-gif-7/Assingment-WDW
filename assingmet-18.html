<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ABESEC College Addmission</title>
    <style>
    body { margin   : 0; font-family: serif; }
    header, footer { background:#1a237e; color: white; text-align: center; }
    header { padding: 30px; }
    footer { padding: 10px; }
    main { max-width: 560px; margin:0 auto; padding: 20px 0; }
    table { width : 100%; border-collapse: collapse; margin-bottom: 20px; }
    th,td { border: 1px solid #999; padding: 6px; text-align: left; }
    th { background: #e8eaf6; text-align: center; }
    textarea { width: 90%;}
    </style>
</head>
<body>
    <header><h1>ABESEC College Admission 2026</h1></header>
    <main>
        <h2>Courses and Fees</h2>
        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>B.Tech CSE</td>
                <td>120</td>
            <td>&#8377;2,00,000</td>
        </tr>
        <tr>
            <td>B.Tech ECE</td>
            <td>100</td>
            <td>&#8377;1,80,000</td>
        </tr>
        <tr>
            <td>B.Tech ME</td>
            <td>80</td>
            <td>&#8377;1,50,000</td>
        </tr>
        <tr>
            <td>B.Tech CE</td>
            <td>60</td>
            <td>&#8377;1,20,000</td>
        </tr>
        <from method="post" action="submit.php">
            <fieldset>
                <legend>Admission Form</legend>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>
                <input type="email" id="email" name="email" required><br><br>
                <label for="course">Select Course:</label><br>
                <select id="course" name="course" required>
                    <option value="">-- Choose Course --</option>
                    <option value="CSE">B.Tech CSE</option>
                    <option value="ECE">B.Tech ECE</option>
                    <option value="ME">B.Tech ME</option>
                    <option value="CE">B.Tech CE</option>
                </select><br><br>
                <label for="statement">Statement:</label><br>
                <textarea id="statement" name="statement" rows="4" required></textarea><br>
                <br>
                <button type="submit">Submit</button>
            </fieldset>
            </tbody>
        </table>
    </main>
    <footer>
        <p>&copy; 2026 ABESEC College. All rights reserved.</p>
    </footer>
</body>
</html>
